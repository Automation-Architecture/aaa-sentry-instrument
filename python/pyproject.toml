[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aaa-sentry-instrument"
version = "0.1.2"
description = "Reusable Sentry instrumentation for AAA FastAPI backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaa_sentry_instrument*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
